name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      # 本番依存の脆弱性を必須ゲートとする。
      # 開発専用 CLI（wrangler/miniflare/undici）の advisory は Dependabot で追跡し、
      # 修正版が公開され次第 update する（デプロイ成果物には含まれない）。
      - run: npm audit --omit=dev --audit-level=high
