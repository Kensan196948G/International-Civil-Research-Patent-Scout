name: Deploy (Cloudflare)

# 将来の Cloudflare 移行用。サブドメインがユーザー承認されるまで実行しない。
# ローカル systemd デプロイは CI 対象外（deploy/install-local.sh を手動実行）。

on:
  workflow_dispatch:
    inputs:
      subdomain_approval:
        description: "サブドメイン承認文字列（例: approve-patent-scout）"
        required: true
        type: string
      environment:
        description: "デプロイ先"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - mvp
          - production

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.subdomain_approval == 'approve-patent-scout' || inputs.subdomain_approval == 'approve-icrps' || inputs.subdomain_approval == 'approve-icrps-mvp' || inputs.subdomain_approval == 'approve-research-patent-scout' || inputs.subdomain_approval == 'approve-civil-research-patent-scout' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @icrps/web
      - name: Deploy preview (workers.dev)
        if: ${{ inputs.environment == 'preview' }}
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler versions upload --env preview
      - name: Deploy MVP (custom domain)
        if: ${{ inputs.environment == 'mvp' }}
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env mvp
      - name: Set MVP secrets
        if: ${{ inputs.environment == 'mvp' }}
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.MVP_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.MVP_JWT_SECRET }}
        run: |
          printf '%s' "$DATABASE_URL" | npx wrangler secret put DATABASE_URL --env mvp
          printf '%s' "$JWT_SECRET" | npx wrangler secret put JWT_SECRET --env mvp
      - name: Deploy production (custom domain)
        if: ${{ inputs.environment == 'production' }}
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler versions upload
      - name: Set production secrets
        if: ${{ inputs.environment == 'production' }}
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          printf '%s' "$DATABASE_URL" | npx wrangler secret put DATABASE_URL
          printf '%s' "$JWT_SECRET" | npx wrangler secret put JWT_SECRET
          if [ -n "$OPENAI_API_KEY" ]; then printf '%s' "$OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY; fi
      - name: Smoke test
        if: ${{ inputs.environment == 'preview' }}
        run: curl -fsS "https://icrps-api-preview.kensan1969.workers.dev/api/health"
      - name: Smoke test (MVP)
        if: ${{ inputs.environment == 'mvp' }}
        run: curl -fsS "https://icrps-mvp.mirai-dx-platform.com/api/health"
